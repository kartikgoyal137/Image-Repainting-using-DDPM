attention_resolutions: 32,16,8
class_cond: false
diffusion_steps: 1000
learn_sigma: true
noise_schedule: linear
num_channels: 256
num_head_channels: 64
num_heads: 4
num_res_blocks: 2
resblock_updown: true
use_fp16: false
use_scale_shift_norm: true
num_heads_upsample: -1
channel_mult: ''
dropout: 0.0
use_checkpoint: false
use_new_attention_order: false
clip_denoised: true
predict_xstart: false
rescale_timesteps: false
show_progress: true
timestep_respacing: '100'
image_size: 256
model_path: ./data/pretrained/celeba256_250000.pt
name: face_example
inpa_inj_sched_prev: true
schedule_jump_params:
  t_T: 100
  n_sample: 1
  jump_length: 10
  jump_n_sample: 3
dynamic_U:
  mode: A # 'A', 'D' or 'AD'
  U_min: 1
  U_max: 10
data:
  eval:
    paper_face_mask:
      mask_loader: true
      gt_path: ./data/datasets/gts/face
      mask_path: ./data/datasets/gt_keep_masks/face
      image_size: 256
      class_cond: false
      deterministic: true
      random_crop: false
      random_flip: false
      return_dict: true
      drop_last: false
      batch_size: 2
      return_dataloader: true
      offset: 0
      max_len: 4
      paths:
        srs: ./log/face_example/inpainted
        lrs: ./log/face_example/gt_masked
        gts: ./log/face_example/gt
        gt_keep_masks: ./log/face_example/gt_keep_mask
